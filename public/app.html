<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E8590C">
<meta name="description" content="Control de fiados con mora automatica para Ferreteria Ferrefacil">
<title>Fiados · Ferrefacil</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<style>
:root{
  --cream:#FAF6EF; --paper:#fff; --charcoal:#23272A; --steel:#5C6B78;
  --line:#E4DCCB; --orange:#E8590C; --orange-dark:#C44D0A;
  --teal:#2F7A6E; --teal-light:#E1F2EE; --red:#C0392B; --red-light:#FBE3E0;
  --amber:#B07A05; --amber-light:#FBF0D9; --radius:12px; --shadow:0 6px 20px rgba(35,39,42,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--charcoal)}
header{background:var(--charcoal);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
main{max-width:900px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
input,select,button{font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);width:100%;box-sizing:border-box}
button{background:var(--orange);color:#fff;border:none;cursor:pointer;width:auto;font-weight:600}
button:hover{background:var(--orange-dark)}
button.secondary{background:#fff;color:var(--charcoal);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row > *{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.badge{padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge.pendiente{background:var(--amber-light);color:var(--amber)}
.badge.parcial{background:#E8EEFB;color:#3457A6}
.badge.pagado{background:var(--teal-light);color:var(--teal)}
.mora{color:var(--red);font-weight:700}
#login-screen{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;padding:30px;border-radius:var(--radius);width:320px}
.hidden{display:none !important}
.error{background:var(--red-light);color:var(--red);padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px}
.offline-banner{background:var(--amber-light);color:var(--amber);padding:8px 24px;font-size:13px;text-align:center}
.separador{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--steel);font-size:12px}
.separador::before,.separador::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;
  color:var(--charcoal);text-decoration:none;font-size:15px;font-weight:600;
  transition:background .15s,box-shadow .15s;
}
.btn-google:hover{background:#F7F4EE;box-shadow:0 2px 8px rgba(35,39,42,.10)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>Fiados · Ferrefacil</h2>
    <p style="color:var(--steel);font-size:14px">Iniciá sesión para continuar</p>
    <div id="login-error" class="error hidden"></div>
    <form id="login-form">
      <div class="row"><input id="login-email" type="email" placeholder="correo" autocomplete="username" required></div>
      <div class="row"><input id="login-password" type="password" placeholder="contraseña" autocomplete="current-password" required></div>
      <button type="submit">Entrar</button>
    </form>

    <div id="google-bloque" class="hidden">
      <div class="separador"><span>o</span></div>
      <a id="btn-google" class="btn-google" href="/api/auth/google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.6 5.9c4.4-4.1 6.7-10.750 6.7-17.4z"/>
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.4 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Continuar con Google
      </a>
    </div>

    <p style="margin:16px 0 0;font-size:13px"><a href="/" style="color:var(--steel)">← Volver al inicio</a></p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="offline-banner" class="offline-banner hidden">Estás sin conexión. Mostrando los últimos datos guardados.</div>
  <header>
    <h1>🔧 Fiados · Ferrefacil</h1>
    <button class="secondary" id="btn-logout">Salir</button>
  </header>
  <main>
    <div class="card">
      <h3>Nuevo cliente</h3>
      <div class="row">
        <input id="c-nombre" placeholder="Nombre del cliente">
        <input id="c-telefono" placeholder="Teléfono">
      </div>
      <button id="btn-crear-cliente">Agregar cliente</button>
    </div>

    <div class="card">
      <h3>Registrar fiado</h3>
      <div class="row">
        <select id="f-cliente"></select>
        <input id="f-desc" placeholder="Descripción (ej. cemento 2 sacos)">
      </div>
      <div class="row">
        <input id="f-monto" type="number" placeholder="Monto (L.)">
        <input id="f-vence" type="date">
      </div>
      <button id="btn-crear-fiado">Registrar fiado</button>
    </div>

    <div class="card">
      <h3>Fiados</h3>
      <table>
        <thead><tr><th>Cliente</th><th>Descripción</th><th>Saldo</th><th>Mora</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tabla-fiados"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
