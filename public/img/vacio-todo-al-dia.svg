<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="Todo al dia">
  <style>
    .confeti{transform-box:fill-box;transform-origin:center;animation:cae 3s ease-in-out infinite}
    .d2{animation-delay:-1s}.d3{animation-delay:-2s}
    .check{stroke-dasharray:40;stroke-dashoffset:40;animation:traza .7s ease-out .3s forwards}
    @keyframes cae{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(25deg)}}
    @keyframes traza{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.check{stroke-dashoffset:0}}
  </style>

  <circle cx="80" cy="60" r="48" fill="#E4EEE9"/>
  <ellipse cx="80" cy="111" rx="44" ry="5" fill="#182028" opacity=".07"/>

  <path d="M54 20h52a6 6 0 0 1 6 6v70l-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5V26a6 6 0 0 1 6-6z" fill="#FFFFFF" stroke="#D5E2DB" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="60" y="34" width="40" height="6" rx="3" fill="#182028" opacity=".75"/>
  <rect x="60" y="48" width="28" height="4" rx="2" fill="#5D6C7B" opacity=".35"/>
  <rect x="60" y="58" width="34" height="4" rx="2" fill="#5D6C7B" opacity=".35"/>
  <rect x="60" y="68" width="22" height="4" rx="2" fill="#5D6C7B" opacity=".35"/>

  <circle cx="106" cy="80" r="17" fill="#2F8A5F"/>
  <circle cx="106" cy="80" r="17" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path class="check" d="M98 80.5l5.5 5.5 10.5-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="confeti" x="28" y="28" width="6" height="10" rx="1.5" fill="#E07A2E"/>
  <rect class="confeti d2" x="126" y="22" width="6" height="10" rx="1.5" fill="#1C7CB5"/>
  <rect class="confeti d3" x="134" y="54" width="5" height="8" rx="1.5" fill="#C0841A"/>
  <circle class="confeti d2" cx="26" cy="72" r="3.5" fill="#2F8A5F"/>
  <circle class="confeti d3" cx="40" cy="98" r="2.5" fill="#1C7CB5"/>
</svg>
