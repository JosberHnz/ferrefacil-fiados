<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110" role="img" aria-label="Casco de obra sobre planos">
  <defs>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C548"/>
      <stop offset="1" stop-color="#D99A1E"/>
    </linearGradient>
    <pattern id="cuadricula" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .flota{animation:flota 5s ease-in-out infinite}
    .chispa{transform-box:fill-box;transform-origin:center;animation:chispa 2.6s ease-in-out infinite}
    .c2{animation-delay:-1.3s}
    .trazo{stroke-dasharray:120;stroke-dashoffset:120;animation:traza 1.6s ease-out .3s forwards}
    @keyframes flota{50%{transform:translateY(-4px)}}
    @keyframes chispa{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
    @keyframes traza{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.trazo{stroke-dashoffset:0}}
  </style>

  <circle cx="84" cy="56" r="46" fill="#E7EFF2"/>
  <ellipse cx="82" cy="103" rx="62" ry="5" fill="#182028" opacity=".08"/>

  <!-- plano -->
  <g transform="rotate(-8 80 66)">
    <rect x="28" y="38" width="104" height="62" rx="4" fill="#1F5468"/>
    <rect x="28" y="38" width="104" height="62" rx="4" fill="url(#cuadricula)"/>
    <path class="trazo" d="M42 88V54h36v16h28v18z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M60 88v-11h11v11" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".85"/>
    <path d="M84 60h16" stroke="#7FB3C4" stroke-width="1.5" stroke-dasharray="3 2"/>
    <rect x="112" y="84" width="40" height="12" rx="6" fill="#DCE7EC"/>
    <ellipse cx="152" cy="90" rx="3.5" ry="6" fill="#B9CCD5"/>
  </g>

  <!-- lapiz -->
  <g transform="translate(18 92) rotate(-35)">
    <rect x="0" y="-3" width="34" height="6" rx="1" fill="#E07A2E"/>
    <path d="M34 -3l7 3-7 3z" fill="#F3D9B1"/>
    <path d="M39 -1l2 1-2 1z" fill="#182028"/>
  </g>

  <!-- casco -->
  <g class="flota">
    <g transform="translate(92 40)">
      <path d="M-24 8a24 22 0 0 1 48 0z" fill="url(#casco)"/>
      <rect x="-4" y="-15" width="8" height="22" rx="3" fill="#F9D56E"/>
      <path d="M-15 -4a18 16 0 0 1 7-7" stroke="#FFF3C4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/>
      <rect x="-31" y="6" width="62" height="7" rx="3.5" fill="#C98A12"/>
    </g>
  </g>

  <path class="chispa" d="M30 22l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#E07A2E"/>
  <path class="chispa c2" d="M140 26l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#1C7CB5"/>
</svg>
